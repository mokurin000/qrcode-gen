name: build-android

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    name: Android APKs

    steps:
      - uses: actions/checkout@v6

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 🦀 Setup Rust
        run: |
          rustup default nightly
          rustup target add x86_64-linux-android
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: 📦️ Setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: ♻️ Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: qrcode-gen-android

      - name: 🏗 Build APKs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          cd android
          gradle assembleRelease

      - name: 📁 Collect split APKs
        shell: bash
        run: |
          mkdir -p dist
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            name=$(basename "$apk")
            abi=$(echo "$name" | sed 's/^app-//;s/-release\.apk$//')
            cp "$apk" "dist/qrcode-gen-android-${abi}.apk"
          done
          ls -lh dist

      - name: 📤 Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: qrcode-gen-android-apks
          path: dist/*
